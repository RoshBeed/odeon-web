name: Deploy
# Builds the site with the published listings inside it and puts it on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The Ingest workflow, after it publishes new listings.
  workflow_call:
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # Built and deployed in two jobs, as GitHub's own Pages workflow does: a deploy in the same job
  # as its upload sometimes looked for the artifact before GitHub listed it ("Found 0 artifact(s)").
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # titles.json on the data release
    outputs:
      published: ${{ steps.listings.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the listings the site carries
        id: listings
        run: |
          bash scripts/listings.sh download
          # Until an ingest publishes listings there is nothing to show.
          if ! ls data/*.sqlite >/dev/null 2>&1; then exit 0; fi
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # Claude cleans the titles it has not seen before (ingest/src/showtimes_ingest/titles.py);
      # Deploys run one at a time, so only one run writes titles.json.
      - name: Clean new film titles with Claude
        if: steps.listings.outputs.published == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker build --target api -f ingest/Dockerfile -t showtimes-ingest .
          before=$(sha256sum data/titles.json 2>/dev/null || true)
          status=0
          docker run --rm -v "$PWD/data:/data" -e ANTHROPIC_API_KEY --entrypoint uv showtimes-ingest \
            run --no-sync showtimes-titles /data > "$RUNNER_TEMP/titles" || status=$?
          cat "$RUNNER_TEMP/titles"
          { echo '### Titles Claude cleaned'; echo; grep -v '^changed=' "$RUNNER_TEMP/titles"; } >> "$GITHUB_STEP_SUMMARY"
          # Each batch is saved as it is answered: what was decided is kept even when a later batch fails.
          if [ -f data/titles.json ] && [ "$(sha256sum data/titles.json)" != "$before" ]; then
            bash scripts/listings.sh upload-titles
          fi
          exit "$status"
      # Every chain's file, exported as the compressed JSON document the site downloads.
      - name: Build the site in Docker
        if: steps.listings.outputs.published == 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work/site \
            --mount type=volume,target=/work/site/node_modules,volume-nocopy \
            node:26-bookworm-slim sh -c 'npm ci && npm run listings && npm run build'
      - uses: actions/configure-pages@v6
        if: steps.listings.outputs.published == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.listings.outputs.published == 'true'
        with:
          path: site/dist
  deploy:
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: pages
